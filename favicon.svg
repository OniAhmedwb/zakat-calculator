<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Background Circle with subtle border -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)" stroke="#10b981" stroke-width="2"/>
  
  <!-- Crescent Moon -->
  <path d="M 34 11 A 19 19 0 0 0 16 33 A 19 19 0 0 0 35 52 A 19 19 0 0 1 23 45 A 19 19 0 0 1 20 31 A 19 19 0 0 1 34 11 Z" fill="url(#gold)" opacity="0.35"/>

  <!-- Balance Scale (Mizan) in Gold -->
  <!-- Central Pillar -->
  <line x1="32" y1="18" x2="32" y2="46" stroke="url(#gold)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="32" cy="18" r="3" fill="url(#gold)"/>
  
  <!-- Base -->
  <path d="M 24 46 L 40 46" stroke="url(#gold)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Beam -->
  <line x1="16" y1="24" x2="48" y2="24" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Left Pan strings & pan -->
  <line x1="16" y1="24" x2="11" y2="35" stroke="url(#gold)" stroke-width="1.5"/>
  <line x1="16" y1="24" x2="21" y2="35" stroke="url(#gold)" stroke-width="1.5"/>
  <path d="M 9 35 Q 16 41 23 35 Z" fill="url(#gold)"/>
  
  <!-- Right Pan strings & pan -->
  <line x1="48" y1="24" x2="43" y2="35" stroke="url(#gold)" stroke-width="1.5"/>
  <line x1="48" y1="24" x2="53" y2="35" stroke="url(#gold)" stroke-width="1.5"/>
  <path d="M 41 35 Q 48 41 55 35 Z" fill="url(#gold)"/>
</svg>
